# Publishes the landing page (site/) to GitHub Pages, with the screenshots from docs/images.
# Repo settings: Pages > Source: GitHub Actions; custom domain cockpitcast.ludvigh.dev.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add the screenshots
        run: mkdir -p site/images && cp docs/images/* site/images/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job: deploy-pages can miss an artifact uploaded a moment earlier in the same job
  # (actions/deploy-pages#451); the job start-up gives GitHub time to list it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
