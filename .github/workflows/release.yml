# Builds a release when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0) and attaches:
#   CockpitCast-Host-Setup.exe            sim PC (Windows)
#   CockpitCast-Client-Setup.exe          display PCs (Windows), and CockpitCast-Client-windows.zip
#   CockpitCast-Client-linux-x64.tar.gz   Linux PCs
#   CockpitCast-Client-linux-arm64.tar.gz Raspberry Pi 4/5 (64-bit OS)
#   SHA256SUMS.txt                        checksums (the updater checks downloads against them)
# It also builds the Android app (APK and Play Store bundle) as a test artifact of the run, not
# attached to the release (see the android job).
# The file names have no version in them, so .../releases/latest/download/<name> always gets the latest.
# The tag must match the version in host/package.json, client/pubspec.yaml and client/lib/about.dart.
# Betas: a tag with a suffix (v0.2.5-beta.1, same version in the code) becomes a GitHub pre-release; see
# the Publish step and docs/development.md ("Beta releases").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check the tag against the version in the code
        run: |
          host=$(node -p "require('./host/package.json').version")
          client=$(grep '^version:' client/pubspec.yaml | sed 's/version: *//; s/+.*//')
          app=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" client/lib/about.dart)
          tag="${GITHUB_REF_NAME#v}"
          echo "host $host, client $client, client appVersion $app, tag $tag"
          [ "$host" = "$client" ] && [ "$client" = "$app" ] || { echo "versions differ: host/package.json, client/pubspec.yaml, client/lib/about.dart"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$host" ]; then echo "tag v$tag does not match version $host"; exit 1; fi
          echo "version=$host" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build (C++, client, installers)
        shell: pwsh
        run: ./installer/build.ps1
      # Code signing goes here once a certificate service is set up (SignPath or Azure Trusted Signing):
      # sign installer/stage/** binaries before the installers are compiled, then the installers.
      - name: Collect
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "installer/output/CockpitCast-Host-$v-Setup.exe" dist/CockpitCast-Host-Setup.exe
          Copy-Item "installer/output/CockpitCast-Client-$v-Setup.exe" dist/CockpitCast-Client-Setup.exe
          Copy-Item "installer/output/CockpitCast-Client-$v-windows.zip" dist/CockpitCast-Client-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Flutter (from git, works on x64 and arm64)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: client
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE installer/THIRD-PARTY-NOTICES.txt client/build/linux/${{ matrix.arch }}/release/bundle/
          tar -czf dist/CockpitCast-Client-linux-${{ matrix.arch }}.tar.gz -C client/build/linux/${{ matrix.arch }}/release bundle --transform 's,^bundle,cockpitcast,'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # Android test build for our own devices, NOT attached to the release: the Android app is planned for
  # the Play Store. Signed with the upload key from the secrets ANDROID_KEYSTORE_BASE64 and
  # ANDROID_KEYSTORE_PASSWORD (alias "upload"). Artifacts of a public repo can be downloaded by any
  # signed-in GitHub user, so the APK and bundle are uploaded only inside a 7z archive encrypted with
  # the keystore password; without the secrets nothing is uploaded (the job still checks that it builds).
  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No upload key in the secrets: the Android app is only built, not uploaded."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=upload" >> "$GITHUB_ENV"
      - name: Build (APK for testing, app bundle for the Play Store)
        working-directory: client
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Pack (encrypted)
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          mkdir -p pack dist
          cp client/build/app/outputs/flutter-apk/app-release.apk pack/CockpitCast-Client-android.apk
          cp client/build/app/outputs/bundle/release/app-release.aab pack/CockpitCast-Client-android.aab
          7z a -t7z -mhe=on "-p$ANDROID_KEYSTORE_PASSWORD" dist/CockpitCast-Client-android.7z ./pack/*
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: android-test
          path: dist/CockpitCast-Client-android.7z
          retention-days: 30

  release:
    needs: [version, windows, linux]
    # The Windows build is required; a failed Linux build only leaves its file out.
    # Android is built above as a test artifact only and is not attached here (planned for the Play
    # Store), so only the Windows and Linux artifacts are downloaded.
    # Only for a version tag: a manual run (Run workflow) just builds, as a test, and publishes nothing.
    if: ${{ !cancelled() && needs.windows.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # A version with a suffix (0.2.5-beta.1) is a beta: a pre-release, which GitHub's "latest" (the
            # website's download links, the updaters) never returns. Only copies with beta versions on see it.
            case "$VERSION" in
              *-*) gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "CockpitCast $VERSION (beta)" --generate-notes --verify-tag --prerelease ;;
              *)   gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "CockpitCast $VERSION" --generate-notes --verify-tag ;;
            esac
          fi
